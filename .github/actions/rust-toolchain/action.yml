name: rust toolchain
description: Installs the nightly toolchain that rust-toolchain.toml pins, with the components it lists; esp-idf-sys brings the libclang bindgen needs.

runs:
  using: composite
  steps:
    - name: Restore the toolchain
      uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

    - name: Install the toolchain rust-toolchain.toml pins
      shell: bash
      run: rustup toolchain install

    - name: Show the toolchain and annotate Rust errors
      shell: bash
      run: |
        rustc -vV
        cargo clippy --version
        echo "::add-matcher::${{ github.action_path }}/rust-problem-matcher.json"
