name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: clippy, tests, BDD, merge gates
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/esp-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Install just and ripgrep
        run: brew install just ripgrep

      - name: Clippy
        run: just clippy

      - name: Host tests
        run: just test

      - name: BDD
        run: just bdd

      - name: Web UI dependencies
        working-directory: web/app
        run: npm ci

      - name: Merge gates
        run: just verify

  esp-check:
    name: firmware type-check (ESP32-P4)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/esp-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore ESP-IDF
        uses: actions/cache@v5
        with:
          path: .embuild
          key: embuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.p4.defaults') }}

      - name: Install just
        run: brew install just

      - name: cargo check on the P4 triple
        run: just esp-check

  clippy-pedantic-advisory:
    name: clippy pedantic (advisory)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/esp-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Clippy pedantic with the allowlist
        continue-on-error: true
        env:
          CLIPPY_HOST_TARGET: aarch64-apple-darwin
        run: bash scripts/run_clippy_pedantic_advisory.sh
