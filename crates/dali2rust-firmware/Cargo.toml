[package]
name = "dali2rust-firmware"
description = "Firmware binary — composition root and DI wiring"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]

[[bin]]
name = "dali2rust"
path = "src/main.rs"

[dependencies]
dali2rust-bus = { path = "../dali2rust-bus" }
dali2rust-domain = { path = "../dali2rust-domain" }
dali2rust-mqtt-runtime = { path = "../dali2rust-mqtt-runtime" }
dali2rust-platform = { path = "../dali2rust-platform" }
dali2rust-api = { path = "../dali2rust-api" }
dali2rust-adapters = { path = "../dali2rust-adapters" }
dali2rust-ota-runtime = { path = "../dali2rust-ota-runtime" }
dali2rust-bsp = { path = "../dali2rust-bsp" }
log = "0.4"

[target.'cfg(target_os = "espidf")'.dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-std", "executor-thread"] }
esp-idf-svc = { version = "0.52.1", features = ["alloc", "critical-section", "embassy-time-driver", "embassy-sync"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"

[[package.metadata.esp-idf-sys.extra_components]]
