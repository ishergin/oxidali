[package]
name = "dali2rust-registry-runtime"
description = "Registry store and workers"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dali2rust-bsp = { path = "../dali2rust-bsp" }
dali2rust-bus = { path = "../dali2rust-bus" }
dali2rust-contracts = { path = "../dali2rust-contracts" }
dali2rust-domain = { path = "../dali2rust-domain" }
dali2rust-platform = { path = "../dali2rust-platform" }
log = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[features]
default = []

[dev-dependencies]
dali2rust-test-support = { path = "../dali2rust-test-support" }
