[package]
name = "dali2rust-p4-bringup"
description = "ESP32-P4-ETH bring-up image: Ethernet link + counters, no DALI (ADR-008)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "p4_eth"
path = "src/main.rs"

[dependencies]
dali2rust-platform = { path = "../dali2rust-platform" }
dali2rust-adapters = { path = "../dali2rust-adapters" }
dali2rust-bsp = { path = "../dali2rust-bsp" }
log = "0.4"

[target.'cfg(target_os = "espidf")'.dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-std", "executor-thread"] }
esp-idf-svc = { version = "0.52.1", features = ["alloc", "critical-section", "embassy-time-driver", "embassy-sync"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"
