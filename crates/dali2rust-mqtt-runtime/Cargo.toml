[package]
name = "dali2rust-mqtt-runtime"
description = "MQTT / Home Assistant bridge worker and client port implementations (I4)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dali2rust-api = { path = "../dali2rust-api" }
dali2rust-bsp = { path = "../dali2rust-bsp" }
dali2rust-bus = { path = "../dali2rust-bus" }
dali2rust-contracts = { path = "../dali2rust-contracts" }
dali2rust-domain = { path = "../dali2rust-domain" }
dali2rust-platform = { path = "../dali2rust-platform" }
log = "0.4"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.52.1", features = ["alloc"] }

[dev-dependencies]
dali2rust-registry-runtime = { path = "../dali2rust-registry-runtime" }
dali2rust-test-support = { path = "../dali2rust-test-support" }
