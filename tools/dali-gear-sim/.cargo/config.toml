[build]
target = "riscv32imafc-esp-espidf"

[target.riscv32imafc-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = { value = "esp32p4", force = true }
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "../../sdkconfig.p4.defaults;sdkconfig.gear-sim.defaults", force = true }
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
ESP_IDF_SYS_ROOT_CRATE = "dali-gear-sim"
